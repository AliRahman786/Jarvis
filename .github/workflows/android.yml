name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Environment Template Exists
        run: |
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=PLACEHOLDER_GEMINI_API_KEY" > .env.example
            echo "MAPS_API_KEY=AIzaSyChMxc5GnRmdhlCj_VFfnDJ2Q_UgBTkzdA" >> .env.example
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Binary
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/JARVIS_Mark_LIV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARVIS_Mark_LIV_APK
          path: release-assets/JARVIS_Mark_LIV.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest' }}
          name: "JARVIS Mark-LIV - Latest Release"
          body: |
            ## 🚀 JARVIS Mark-LIV Official Release
            
            ### 📱 Download & Installation
            Download the attached **`JARVIS_Mark_LIV.apk`** below directly to your Android device to install.
            
            ### ✨ Features & Upgrades:
            - **Full-Duplex Voice Receptor**: Real-time voice commands and seamless continuous conversation.
            - **Zero Acoustic Feedback**: Automatic speaker isolation prevents speaker feedback loops and non-stopping sound.
            - **Tactical Telemetry & Google Maps**: Inbuilt tactical radar with live GPS coordinate calibration.
            - **Creator Authority Protocols**: Dedicated boss & developer recognition for Ali Rahman.
          draft: false
          prerelease: false
          files: release-assets/JARVIS_Mark_LIV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
